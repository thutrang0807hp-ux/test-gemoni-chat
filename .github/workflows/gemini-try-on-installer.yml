name: Gemini Try-On installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gemini-try-on/**
      - .github/workflows/gemini-try-on-installer.yml

permissions:
  contents: write

concurrency:
  group: gemini-try-on-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Gemini runtime
        working-directory: gemini-try-on/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package the app
        shell: pwsh
        run: |
          python -m pip install -r gemini-try-on/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --name Gemini-Thu-Do gemini-try-on/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = 'dist/Gemini-Thu-Do/runtime'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item gemini-try-on/runtime/gemini.mjs, gemini-try-on/runtime/package.json $runtime
          Copy-Item gemini-try-on/runtime/node_modules $runtime -Recurse
          Copy-Item (Get-Command node.exe).Source $runtime
          $archive = Join-Path $env:RUNNER_TEMP 'GeminiWatermarkTool.zip'
          Invoke-WebRequest 'https://github.com/allenk/GeminiWatermarkTool/releases/download/v0.3.2/GeminiWatermarkTool-Windows-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '1c6734a6503ee6e34a424e8bf6c8db2db18e2afb286cb0c8622b8a1015abb6eb') {
            throw 'GeminiWatermarkTool archive checksum mismatch'
          }
          $watermark = Join-Path $runtime 'watermark'
          Expand-Archive -LiteralPath $archive -DestinationPath $watermark
          Invoke-WebRequest 'https://raw.githubusercontent.com/allenk/GeminiWatermarkTool/v0.3.2/LICENSE' -OutFile (Join-Path $watermark 'LICENSE.txt')
          $check = Start-Process dist/Gemini-Thu-Do/Gemini-Thu-Do.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - name: Build and test the installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler gemini-try-on/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'GeminiThuDoCheck'
          $setup = Start-Process try-on-installer/Gemini-Tao-Anh-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $app = Start-Process (Join-Path $target 'Gemini-Thu-Do.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Tao-Anh-Setup
          path: try-on-installer/Gemini-Tao-Anh-Setup.exe
          if-no-files-found: error
      - name: Publish independent installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gemini-tao-anh-v0.4.4 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload gemini-tao-anh-v0.4.4 try-on-installer/Gemini-Tao-Anh-Setup.exe --clobber
          } else {
            gh release create gemini-tao-anh-v0.4.4 try-on-installer/Gemini-Tao-Anh-Setup.exe --target "$env:GITHUB_SHA" --title "Gemini Tạo Ảnh 0.4.4" --notes "Bản thử Windows x64 riêng, tạo ảnh từ prompt và viết lại prompt trong app."
          }
          exit $LASTEXITCODE
