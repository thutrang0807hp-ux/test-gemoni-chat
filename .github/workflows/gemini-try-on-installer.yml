name: Gemini Try-On installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gemini-try-on/**
      - .github/workflows/gemini-try-on-installer.yml

permissions:
  contents: write

concurrency:
  group: gemini-try-on-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Package the app
        shell: pwsh
        run: |
          python -m pip install -r gemini-try-on/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --name Gemini-Thu-Do gemini-try-on/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item gemini-try-on/extension dist/Gemini-Thu-Do/extension -Recurse
          $check = Start-Process dist/Gemini-Thu-Do/Gemini-Thu-Do.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - name: Build and test the installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler gemini-try-on/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'GeminiThuDoCheck'
          $setup = Start-Process try-on-installer/Gemini-Thu-Do-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $app = Start-Process (Join-Path $target 'Gemini-Thu-Do.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - name: Package the Chrome extension
        shell: pwsh
        run: Compress-Archive -Path gemini-try-on/extension -DestinationPath try-on-installer/Gemini-Thu-Do-Extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Thu-Do-Setup
          path: |
            try-on-installer/Gemini-Thu-Do-Setup.exe
            try-on-installer/Gemini-Thu-Do-Extension.zip
          if-no-files-found: error
      - name: Publish independent installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gemini-thu-do-v0.2.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload gemini-thu-do-v0.2.0 try-on-installer/Gemini-Thu-Do-Setup.exe try-on-installer/Gemini-Thu-Do-Extension.zip --clobber
          } else {
            gh release create gemini-thu-do-v0.2.0 try-on-installer/Gemini-Thu-Do-Setup.exe try-on-installer/Gemini-Thu-Do-Extension.zip --target "$env:GITHUB_SHA" --title "Gemini Thử Đồ 0.2.0" --notes "Bản thử Windows x64 riêng, kết nối phiên Gemini Chat qua extension trong Chrome thường dùng."
          }
          exit $LASTEXITCODE
