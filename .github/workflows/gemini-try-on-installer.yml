name: Gemini Try-On installer
on:
  workflow_dispatch:
  push:
    branches: [main, reference-attachments]
    paths:
      - gemini-try-on/**
      - .github/workflows/gemini-try-on-installer.yml

permissions:
  contents: write

concurrency:
  group: gemini-try-on-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Gemini runtime
        working-directory: gemini-try-on/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Browser regression tests
        shell: pwsh
        run: |
          $env:CHROMIUM = Join-Path $env:PROGRAMFILES 'Google/Chrome/Application/chrome.exe'
          $ErrorActionPreference = 'Continue'
          foreach ($test in @('attachments.mjs', 'roundtrip.mjs', 'diagnostics.mjs')) {
            $result = & node "gemini-try-on/tests/$test" 2>&1
            $code = $LASTEXITCODE
            $result | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $detail = ($result | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=${test}::$detail"
              exit $code
            }
          }
      - name: Check runtime syntax
        run: node --check gemini-try-on/runtime/gemini.mjs
      - name: Package the app
        shell: pwsh
        run: |
          python -m pip install -r gemini-try-on/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python gemini-try-on/tests/test_reference_bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --name Gemini-Thu-Do gemini-try-on/main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = 'dist/Gemini-Thu-Do/runtime'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item gemini-try-on/runtime/gemini.mjs, gemini-try-on/runtime/package.json $runtime
          Copy-Item gemini-try-on/runtime/node_modules $runtime -Recurse
          Copy-Item (Get-Command node.exe).Source $runtime
          $archive = Join-Path $env:RUNNER_TEMP 'GeminiWatermarkTool.zip'
          Invoke-WebRequest 'https://github.com/allenk/GeminiWatermarkTool/releases/download/v0.3.2/GeminiWatermarkTool-Windows-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '1c6734a6503ee6e34a424e8bf6c8db2db18e2afb286cb0c8622b8a1015abb6eb') {
            throw 'GeminiWatermarkTool archive checksum mismatch'
          }
          $watermark = Join-Path $runtime 'watermark'
          Expand-Archive -LiteralPath $archive -DestinationPath $watermark
          Invoke-WebRequest 'https://raw.githubusercontent.com/allenk/GeminiWatermarkTool/v0.3.2/LICENSE' -OutFile (Join-Path $watermark 'LICENSE.txt')
          $check = Start-Process dist/Gemini-Thu-Do/Gemini-Thu-Do.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - name: Build and test the installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler gemini-try-on/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'GeminiThuDoCheck'
          $setup = Start-Process try-on-installer/Gemini-Tao-Anh-References-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $app = Start-Process (Join-Path $target 'Gemini-Thu-Do.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: Gemini-Tao-Anh-References-Setup
          path: try-on-installer/Gemini-Tao-Anh-References-Setup.exe
          if-no-files-found: error
      - name: Publish independent installer
        if: github.ref == 'refs/heads/reference-attachments'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing release is expected on first publication. PowerShell's
          # default Stop preference must not abort before the create branch.
          $ErrorActionPreference = 'Continue'
          gh release view gemini-tao-anh-references-v0.4.8 *> $null
          $exists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload gemini-tao-anh-references-v0.4.8 try-on-installer/Gemini-Tao-Anh-References-Setup.exe --clobber
          } else {
            gh release create gemini-tao-anh-references-v0.4.8 --verify-tag try-on-installer/Gemini-Tao-Anh-References-Setup.exe --target "$env:GITHUB_SHA" --title "Gemini Tạo Ảnh 0.4.8 — sửa mở menu đính kèm" --notes "Sửa tìm nút đính kèm và xử lý Open upload file menu, nút icon dấu cộng, menu Upload files và filechooser native. Kiểm tra trọn lượt qua các trường hợp này trên Chrome Windows. Giữ phần gửi/nhận ảnh gốc. Chưa xác nhận trên tài khoản Gemini thực. Không thay SceneForge."
          }
          exit $LASTEXITCODE
