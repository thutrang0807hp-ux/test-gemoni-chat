name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop.py
      - flow_desktop.py
      - windows/**
      - app.py
      - .github/workflows/windows-installer.yml

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Flow runtime
        working-directory: windows/flow-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package the app
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --name Studio-Anh-Gemini desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = 'dist/Studio-Anh-Gemini/flow-runtime'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item windows/flow-runtime/studio.mjs, windows/flow-runtime/package.json $runtime
          Copy-Item windows/flow-runtime/node_modules $runtime -Recurse
          Copy-Item (Get-Command node.exe).Source $runtime
          $check = Start-Process dist/Studio-Anh-Gemini/Studio-Anh-Gemini.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - name: Build and test the installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'StudioInstallCheck'
          $setup = Start-Process installer/Studio-Anh-Gemini-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $app = Start-Process (Join-Path $target 'Studio-Anh-Gemini.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Anh-Gemini-Setup
          path: installer/Studio-Anh-Gemini-Setup.exe
          if-no-files-found: error
      - name: Publish download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-v0.3.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload windows-v0.3.0 installer/Studio-Anh-Gemini-Setup.exe --clobber
          } else {
            gh release create windows-v0.3.0 installer/Studio-Anh-Gemini-Setup.exe --target "$env:GITHUB_SHA" --title "Studio Ảnh Gemini for Windows 0.3.0" --notes "Windows x64. Viết lại kịch bản bằng Gemini và thay đồ bằng Google Flow qua hồ sơ Chrome riêng."
          }
          exit $LASTEXITCODE
