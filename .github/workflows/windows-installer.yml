name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - desktop.py
      - gemini_chat.py
      - windows/**
      - app.py
      - .github/workflows/windows-installer.yml

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Package the app
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --onedir --windowed --collect-all curl_cffi --name Studio-Anh-Gemini desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $check = Start-Process dist/Studio-Anh-Gemini/Studio-Anh-Gemini.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - name: Build and test the installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler windows/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target = Join-Path $env:RUNNER_TEMP 'StudioInstallCheck'
          $setup = Start-Process installer/Studio-Anh-Gemini-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { exit $setup.ExitCode }
          $app = Start-Process (Join-Path $target 'Studio-Anh-Gemini.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: Studio-Anh-Gemini-Setup
          path: installer/Studio-Anh-Gemini-Setup.exe
          if-no-files-found: error
      - name: Publish download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view windows-v0.2.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload windows-v0.2.0 installer/Studio-Anh-Gemini-Setup.exe --clobber
          } else {
            gh release create windows-v0.2.0 installer/Studio-Anh-Gemini-Setup.exe --target "$env:GITHUB_SHA" --title "Studio Ảnh Gemini for Windows 0.2.0" --notes "Windows x64. Phiên Gemini Chat được lưu trong Windows Credential Manager."
          }
          exit $LASTEXITCODE
