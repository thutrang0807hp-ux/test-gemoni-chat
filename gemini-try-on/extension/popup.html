<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Gemini Thử Đồ</title>
<style>
body{width:290px;padding:14px;font:15px system-ui;margin:0}
h1{font-size:20px;margin:0 0 10px}
input{width:100%;box-sizing:border-box;padding:7px;margin:7px 0}
button{padding:6px 9px}
p{margin:8px 0}
</style>
<h1>Gemini Thử Đồ</h1>
<p>Bấm Kết nối Gemini trong app để sao chép mã.</p>
<form>
<label for="code">Mã kết nối</label>
<input id="code" maxlength="24" autocomplete="off" spellcheck="false" type="password">
<button>Kết nối</button>
</form>
<p id="status" role="status"></p>
<a href="https://gemini.google.com/app" target="_blank" rel="noopener noreferrer">Mở Gemini để đăng nhập</a>
<script src="popup.js"></script>
</html>
